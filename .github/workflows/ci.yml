name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    name: Validate (Python ${{ matrix.python-version }})
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install ruff mypy bandit pytest

      - name: Run Ruff Lints
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Verification
        run: uv run mypy --ignore-missing-imports --explicit-package-bases src/

      - name: Run Bandit Security Audit
        run: uv run bandit -r src/

      - name: Run Unit Tests
        run: uv run python -m unittest discover -s tests/
